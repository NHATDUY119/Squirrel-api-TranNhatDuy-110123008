name: Java CI with Maven

on:
  push:
    branches: [ "main" ] # Chạy mỗi khi push code lên branch main
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest # Sử dụng máy ảo Ubuntu của GitHub

    steps:
    - uses: actions/checkout@v4 # Bước 1: Lấy code từ kho về máy ảo
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4 # Bước 2: Cài đặt Java
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: Build and Test with Maven
      run: |
        cd JavaMaven-trannhatduy-110123008
        mvn clean test # Bước 3: Di chuyển vào thư mục dự án và chạy Unit Test